<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="markGlow">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded hexagon / square -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#111116" stroke="url(#logoMarkGrad)" stroke-width="2.5" />
  
  <!-- Stylized B + D Monogram Geometry -->
  <g filter="url(#markGlow)">
    <!-- Vertical stem -->
    <rect x="34" y="30" width="8" height="60" rx="4" fill="#ffffff" />
    
    <!-- Top Loop (B) -->
    <path d="M 42 34 H 65 Q 82 34 82 48 Q 82 60 65 60 H 42 Z" 
          fill="none" stroke="url(#logoMarkGrad)" stroke-width="7" stroke-linejoin="round" />
          
    <!-- Bottom Loop (D / lower B) -->
    <path d="M 42 60 H 68 Q 88 60 88 74 Q 88 88 68 88 H 42 Z" 
          fill="none" stroke="url(#logoMarkGrad)" stroke-width="7" stroke-linejoin="round" />
          
    <!-- Accent Core Dot -->
    <circle cx="62" cy="74" r="4.5" fill="#38bdf8" />
  </g>
</svg>
