<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCards" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgCards)" />

  <!-- Multiple Educational Cards arranged diagonally -->
  <!-- Card 1: Certificate of Excellence (Left) -->
  <g transform="translate(100, 90) rotate(-6)">
    <rect width="320" height="220" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <!-- Certificate Border Frame -->
    <rect x="10" y="10" width="300" height="200" rx="6" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2" />
    
    <!-- Gold Seal -->
    <circle cx="160" cy="55" r="22" fill="url(#goldRibbon)" />
    <polygon points="160,42 164,52 175,52 166,59 170,70 160,63 150,70 154,59 145,52 156,52" fill="#78350f" />
    
    <text x="160" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#fef3c7" text-anchor="middle">CERTIFICATE OF EXCELLENCE</text>
    <text x="160" y="118" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Awarded to Outstanding Students</text>
    
    <!-- Student Name Placeholder Line -->
    <line x1="60" y1="150" x2="260" y2="150" stroke="#f59e0b" stroke-width="1.5" />
    <text x="160" y="145" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Top Rank Achiever</text>
    <text x="160" y="172" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Secondary High School Tutoring Group</text>
    
    <text x="50" y="198" font-family="sans-serif" font-size="8" fill="#94a3b8">Teacher's Signature</text>
    <text x="270" y="198" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="end">Date: 2026</text>
  </g>

  <!-- Card 2: Revision Flashcard (Right) -->
  <g transform="translate(380, 180) rotate(4)">
    <rect width="320" height="220" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2" />
    <rect x="20" y="20" width="80" height="22" rx="11" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="60" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">FLASHCARD</text>
    
    <text x="20" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Key Exam Question</text>
    <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#94a3b8">Essential formula review for exam night</text>

    <!-- Visual Box -->
    <rect x="20" y="105" width="280" height="60" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="160" y="138" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">E = mc² • Quick Rule #07</text>

    <!-- Footer of card -->
    <text x="20" y="195" font-family="sans-serif" font-size="9" fill="#6b7280">Teacher Support Materials • Boda Design</text>
    <circle cx="285" cy="190" r="10" fill="#38bdf8" fill-opacity="0.3" />
    <text x="285" y="194" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">✓</text>
  </g>

  <!-- Card 3: Student Motivational Badge Card (Bottom Center) -->
  <g transform="translate(240, 390)">
    <rect width="320" height="120" rx="10" fill="#090d16" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="50" cy="60" r="24" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
    <text x="50" y="66" font-family="sans-serif" font-size="18" fill="#818cf8" text-anchor="middle">⭐</text>
    <text x="90" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Motivational Student Tokens</text>
    <text x="90" y="72" font-family="sans-serif" font-size="11" fill="#94a3b8">Designed for classroom &amp; study group incentives</text>
    <text x="90" y="90" font-family="sans-serif" font-size="9" fill="#818cf8">Ready for color printing and card stock cutting</text>
  </g>

  <!-- Tag Label -->
  <rect x="240" y="25" width="320" height="26" rx="13" fill="#030712" stroke="#f59e0b" stroke-width="1" />
  <text x="400" y="42" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">EDUCATIONAL FLASHCARDS &amp; CERTIFICATES</text>
</svg>
