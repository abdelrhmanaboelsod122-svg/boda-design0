<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSocial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="socialAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgSocial)" />

  <!-- Multiple Carousel Slide Cards floating in perspective -->
  <!-- Left Slide (Background) -->
  <g transform="translate(100, 100) scale(0.85)" opacity="0.4">
    <rect width="400" height="400" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <rect x="30" y="30" width="80" height="10" rx="5" fill="#38bdf8"/>
    <rect x="30" y="60" width="200" height="24" rx="4" fill="#ffffff"/>
  </g>

  <!-- Right Slide (Background) -->
  <g transform="translate(360, 100) scale(0.85)" opacity="0.4">
    <rect width="400" height="400" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <rect x="30" y="30" width="80" height="10" rx="5" fill="#818cf8"/>
    <rect x="30" y="60" width="200" height="24" rx="4" fill="#ffffff"/>
  </g>

  <!-- Main Focus Slide (Foreground) -->
  <g transform="translate(200, 75)">
    <!-- Shadow -->
    <rect x="-10" y="10" width="420" height="440" rx="20" fill="#000000" opacity="0.6" filter="blur(15px)" />
    
    <!-- Post Frame -->
    <rect width="400" height="440" rx="16" fill="#111116" stroke="#3b82f6" stroke-width="1.5" />
    
    <!-- User Header Bar -->
    <circle cx="45" cy="45" r="18" fill="url(#socialAccent)" />
    <text x="45" y="50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BD</text>
    <text x="75" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f4f4f5">boda_design</text>
    <text x="75" y="56" font-family="sans-serif" font-size="10" fill="#71717a">Graphic Designer</text>
    <circle cx="360" cy="45" r="3" fill="#71717a"/>
    <circle cx="350" cy="45" r="3" fill="#71717a"/>
    <circle cx="370" cy="45" r="3" fill="#71717a"/>

    <!-- Creative Canvas Inner -->
    <g transform="translate(25, 80)">
      <rect width="350" height="260" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1" />
      
      <!-- Visual elements -->
      <circle cx="175" cy="110" r="70" fill="url(#socialAccent)" fill-opacity="0.15" />
      <polygon points="175,60 220,135 130,135" fill="none" stroke="#38bdf8" stroke-width="3" />
      <circle cx="175" cy="115" r="24" fill="#818cf8" fill-opacity="0.3" stroke="#818cf8" stroke-width="2" />
      
      <text x="175" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">ENGAGING FEED VISUALS</text>
      <text x="175" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a1a1aa" text-anchor="middle">Clean Typography • High CTR • Creative Palette</text>
    </g>

    <!-- Post Action Icons (Like, Comment, Share) -->
    <g transform="translate(25, 360)">
      <!-- Heart -->
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ef4444" transform="scale(0.8)"/>
      <!-- Comment -->
      <circle cx="48" cy="10" r="9" fill="none" stroke="#a1a1aa" stroke-width="2" />
      <!-- Share -->
      <polygon points="80,4 96,10 80,16 84,10" fill="#a1a1aa" />

      <!-- Carousel indicator dots -->
      <circle cx="175" cy="10" r="3" fill="#38bdf8" />
      <circle cx="187" cy="10" r="3" fill="#52525b" />
      <circle cx="199" cy="10" r="3" fill="#52525b" />
    </g>

    <!-- Likes / Caption line -->
    <rect x="25" y="395" width="220" height="8" rx="4" fill="#3f3f46" />
    <rect x="25" y="410" width="160" height="6" rx="3" fill="#27272a" />
  </g>

  <!-- Tag Label -->
  <rect x="240" y="20" width="320" height="26" rx="13" fill="#18181b" stroke="#3b82f6" stroke-width="1" />
  <text x="400" y="37" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SOCIAL MEDIA CAROUSEL &amp; POST MOCKUP</text>
</svg>
