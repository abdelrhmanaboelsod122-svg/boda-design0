<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStoryBoard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgStoryBoard)" />

  <!-- Smartphone Mockup for Story / Reel Ad (9:16 ratio) -->
  <g transform="translate(265, 40)">
    <!-- Phone Body -->
    <rect width="270" height="520" rx="36" fill="#09090b" stroke="#27272a" stroke-width="4" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="95" y="14" width="80" height="18" rx="9" fill="#000000" />
    
    <!-- Phone Screen -->
    <rect x="12" y="12" width="246" height="496" rx="28" fill="url(#screenGrad)" />

    <!-- Top Story Progress Bars -->
    <g transform="translate(24, 25)">
      <rect x="0" y="0" width="65" height="3" rx="1.5" fill="#ffffff" />
      <rect x="73" y="0" width="65" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.8" />
      <rect x="146" y="0" width="65" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.3" />
    </g>

    <!-- Account handle & time -->
    <g transform="translate(24, 38)">
      <circle cx="12" cy="12" r="12" fill="url(#neonCyan)" />
      <text x="12" y="16" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">BD</text>
      <text x="32" y="12" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">boda_design</text>
      <text x="32" y="22" font-family="sans-serif" font-size="8" fill="#94a3b8">Sponsored Story</text>
    </g>

    <!-- Visual Center Graphic in Story -->
    <g transform="translate(24, 90)">
      <!-- Animated looking shapes -->
      <circle cx="111" cy="110" r="75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
      <circle cx="111" cy="110" r="50" fill="url(#neonCyan)" fill-opacity="0.25" />
      
      <!-- Central Graphic Element -->
      <polygon points="111,70 145,130 77,130" fill="none" stroke="#ffffff" stroke-width="3" />
      <circle cx="111" cy="115" r="14" fill="#38bdf8" />

      <!-- Story Big Text -->
      <text x="111" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">TRANSFORM</text>
      <text x="111" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle">YOUR BRAND</text>
      
      <text x="111" y="275" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">High Impact Mobile Adverts</text>
    </g>

    <!-- Swipe Up / Call to action at bottom of story -->
    <g transform="translate(75, 430)">
      <path d="M60 0 L52 10 L68 10 Z" fill="#38bdf8" />
      <rect x="0" y="16" width="120" height="32" rx="16" fill="url(#neonCyan)" />
      <text x="60" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">SWIPE UP</text>
    </g>
  </g>

  <!-- Tag Label -->
  <rect x="250" y="12" width="300" height="24" rx="12" fill="#18181b" stroke="#38bdf8" stroke-width="1" />
  <text x="400" y="28" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">MOBILE REEL &amp; STORY AD MOCKUP</text>
</svg>
