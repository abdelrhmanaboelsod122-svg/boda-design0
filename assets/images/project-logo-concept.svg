<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121217" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgDarkLogo)" />

  <!-- Construction / Golden Ratio Grid -->
  <g stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1">
    <circle cx="400" cy="270" r="140" fill="none" stroke-dasharray="3 3"/>
    <circle cx="400" cy="270" r="90" fill="none" stroke-dasharray="3 3"/>
    <circle cx="400" cy="270" r="50" fill="none" stroke-dasharray="3 3"/>
    <line x1="160" y1="270" x2="640" y2="270" stroke-dasharray="2 4"/>
    <line x1="400" y1="90" x2="400" y2="450" stroke-dasharray="2 4"/>
    <line x1="260" y1="130" x2="540" y2="410" stroke-dasharray="2 4"/>
  </g>

  <!-- Modern Logo Mark (Geometric Monogram / Stylized B & D Fusion) -->
  <g filter="url(#logoGlow)">
    <!-- Outer Arc -->
    <path d="M 330 190 Q 400 130 470 190 Q 520 230 490 300 Q 450 380 370 380 L 330 380 Z" 
          fill="none" stroke="url(#neonGradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner Dynamic Polygon -->
    <path d="M 365 240 L 420 240 Q 450 240 450 270 Q 450 300 420 300 L 365 300 Z" 
          fill="url(#neonGradient)" fill-opacity="0.25" stroke="url(#neonGradient)" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="365" cy="270" r="16" fill="#60a5fa" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="430" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">BODA DESIGN</text>
  <text x="400" y="458" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle" letter-spacing="4">IDENTITY &amp; LOGO CONCEPT</text>

  <!-- Color Palette Swatches -->
  <g transform="translate(290, 485)">
    <rect x="0" y="0" width="38" height="12" rx="4" fill="#09090b" stroke="#374151" stroke-width="1"/>
    <rect x="46" y="0" width="38" height="12" rx="4" fill="#1e1b4b" />
    <rect x="92" y="0" width="38" height="12" rx="4" fill="#3b82f6" />
    <rect x="138" y="0" width="38" height="12" rx="4" fill="#60a5fa" />
    <rect x="184" y="0" width="38" height="12" rx="4" fill="#ffffff" />
  </g>

  <!-- Top Indicator Badge -->
  <rect x="250" y="40" width="300" height="28" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
  <text x="400" y="58" font-family="sans-serif" font-size="10" font-weight="bold" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">MINIMALIST BRAND VECTOR SYSTEM</text>
</svg>
