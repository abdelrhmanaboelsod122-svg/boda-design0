<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="adRadial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="adShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#adRadial)" />

  <!-- Diagonal Light Beam / Graphic Design Angles -->
  <polygon points="150,0 350,0 200,600 0,600" fill="#38bdf8" fill-opacity="0.04" />
  <polygon points="500,0 720,0 580,600 360,600" fill="#6366f1" fill-opacity="0.04" />

  <!-- Ad Layout Frame -->
  <g filter="url(#adShadow)" transform="translate(150, 50)">
    <rect width="500" height="500" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2" />
    
    <!-- Top Brand Strip -->
    <rect x="30" y="30" width="100" height="24" rx="12" fill="#1e293b" />
    <text x="80" y="46" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">SPECIAL OFFER</text>
    <text x="470" y="46" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">AD CAMPAIGN</text>

    <!-- Visual Centerpiece: 3D Product/Creative Focus -->
    <circle cx="250" cy="220" r="120" fill="url(#glowGrad)" fill-opacity="0.15" />
    <circle cx="250" cy="220" r="85" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- Geometric Dynamic Product Silhouette -->
    <polygon points="250,150 320,195 320,270 250,315 180,270 180,195" fill="#1e1b4b" stroke="#60a5fa" stroke-width="3" />
    <polygon points="250,150 320,195 250,240 180,195" fill="#3b82f6" fill-opacity="0.4" />
    <polygon points="250,240 320,195 320,270 250,315" fill="#1d4ed8" fill-opacity="0.5" />
    <polygon points="250,240 180,195 180,270 250,315" fill="#2563eb" fill-opacity="0.3" />

    <!-- Punchy Ad Headlines -->
    <text x="250" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">GRAB ATTENTION</text>
    <text x="250" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">High-Converting Commercial Visuals Designed to Stand Out</text>

    <!-- Call to Action Button inside Ad -->
    <rect x="175" y="420" width="150" height="42" rx="21" fill="url(#glowGrad)" />
    <text x="250" y="446" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ORDER NOW</text>
  </g>

  <!-- Tag / Concept Label -->
  <rect x="250" y="20" width="300" height="24" rx="6" fill="#030712" stroke="#38bdf8" stroke-width="1" />
  <text x="400" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">COMMERCIAL ADVERTISEMENT MOCKUP</text>
</svg>
